<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Lab — Erica Yabiku</title>
<link rel="shortcut icon" href="./images/developmenticon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: ferramenta de estúdio, silenciosa, o preview é a estrela
   IDEA: um painel de controles de gerador, como o do print de referência
   PICTURE: a própria mandala ASCII animada, grande, no palco escuro
   COLOUR and TYPE: palco preto, painel claro/escuro neutro, acento verde #00ff40; Inter + JetBrains Mono
   LAYOUT: palco à esquerda, painel de 340px à direita; empilha abaixo de 760px */
:root{color-scheme:light dark;--bg:light-dark(#f3f3f1,#161618);--panel:light-dark(#fbfbfa,#1c1c1f);--ink:light-dark(#141416,#ececee);--mute:light-dark(#6c6c72,#9a9aa2);--line:light-dark(#e2e2df,#2c2c31);--field:light-dark(#efefec,#26262a);--acc:#00c838;--stage:#0b0b0c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;overflow-x:clip}
.app{display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,40%,340px);height:100vh}
.stage{background:var(--stage);display:flex;flex-direction:column;min-height:0;color:#d8d8dc}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #222;flex-wrap:wrap}
.bar .back{color:#9a9aa2;text-decoration:none;font-size:13px}.bar .back:hover{color:#fff}
.bar b{font:700 13px "JetBrains Mono",monospace;color:#fff}
.bar .fr{font:500 12px "JetBrains Mono",monospace;color:#9a9aa2;margin-left:auto;white-space:nowrap}
.cw{flex:1;position:relative;min-height:0}
canvas#cv{position:absolute;border-radius:4px;box-shadow:0 0 0 1px #262629}
canvas#cv.tr{background:repeating-conic-gradient(#1d1d20 0 25%,#141416 0 50%) 0 0/24px 24px}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"▾";color:var(--mute)}details:not([open]) summary::after{content:"▸"}
.rows{padding:0 16px 14px;display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,104px) minmax(0,1fr) 44px;align-items:center;gap:8px}
.row.w{grid-template-columns:minmax(0,104px) minmax(0,1fr)}
.row label{color:var(--mute);font-size:12.5px}
.row output{font:500 12px "JetBrains Mono",monospace;text-align:right;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--ink);height:28px;margin:0}
select,input[type=text]{width:100%;font:inherit;font-size:13px;padding:7px 8px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--ink);min-height:34px}
input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:2px;cursor:pointer}
.seg{display:flex;background:var(--field);border-radius:7px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12.5px;padding:6px 3px;border-radius:5px;font-size:12px;white-space:nowrap;cursor:pointer;min-height:30px}
.seg button.on{background:var(--ink);color:var(--panel)}
.btn{font:inherit;font-weight:500;font-size:13px;padding:9px 12px;border-radius:7px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;min-height:38px}
.btn.pri{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:wait}
.btn.sm{min-height:30px;padding:5px 10px;font-size:12px}
.pb{background:#1f1f22;border-color:#333;color:#eee}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12px;color:var(--mute);margin:0}
#msg{font-size:12.5px;min-height:18px;color:var(--ink)}
.prog{height:4px;background:var(--field);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc)}
.row label{overflow-wrap:anywhere}
.seg.multi{flex-wrap:wrap}.seg.multi button{flex:1 1 30%}
.row.col .seg{flex-wrap:wrap}.row.col .seg button{flex:1 1 auto;padding-inline:8px}
.row.col{grid-template-columns:minmax(0,1fr);gap:6px}
.fs .app{grid-template-columns:1fr}.fs .panel,.fs .bar{display:none}.fs .stage{height:100vh}.fs canvas#cv{box-shadow:none;border-radius:0}
@media(max-width:520px){.app{grid-template-columns:1fr;height:auto}.stage{height:72vh}.panel{border-left:0}}
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <div class="bar">
      <a class="back" href="./index.html">&larr; Erica Y.</a>
      <b>ASCII LAB</b>
      <button class="btn sm pb" id="playBtn" type="button">Pausar</button>
      <button class="btn sm pb" id="fsBtn" type="button" data-pt="Tela cheia (F)" data-en="Fullscreen (F)">Tela cheia (F)</button>
      <span class="fr" id="fr">frame 0 / 450</span>
      <button class="btn sm pb" id="langBtn" type="button">EN</button>
      <button class="btn sm pb" id="themeBtn" type="button" aria-label="Tema">☾</button>
    </div>
    <div class="cw" id="cw"><canvas id="cv" width="1080" height="1920"></canvas></div>
  </section>
  <aside class="panel">
    <div class="ph"><span data-pt="Controles" data-en="Controls">Controles</span><span style="display:flex;gap:6px"><button class="btn sm" id="randBtn" type="button" data-pt="Aleatório" data-en="Random">Aleatório</button><button class="btn sm" id="resetBtn" type="button" data-pt="Resetar" data-en="Reset">Resetar</button></span></div>
    <div id="ctl"></div>
    <details open><summary>Presets</summary><div class="rows">
      <div class="row w"><label for="pname" data-pt="Nome" data-en="Name">Nome</label><input type="text" id="pname" placeholder="Meu preset"></div>
      <div class="row w"><label for="plist" data-pt="Salvos" data-en="Saved">Salvos</label><select id="plist"></select></div>
      <div class="grid2"><button class="btn" id="psave" type="button" data-pt="Salvar preset" data-en="Save preset">Salvar preset</button><button class="btn" id="pdel" type="button" data-pt="Apagar" data-en="Delete">Apagar</button></div>
    </div></details>
    <details open><summary data-pt="Sobre o ASCII Lab" data-en="About ASCII Lab">Sobre o ASCII Lab</summary><div class="rows">
      <p class="note" data-pt="Um gerador de arte ASCII criado por Érica Yabiku. Esta é uma versão para testar: crie à vontade, use sua câmera e brinque com as formas. O download fica só na versão de estúdio." data-en="An ASCII art generator built by Érica Yabiku. This is a playground version: create freely, use your camera and play with the shapes. Downloads are only available in the studio version.">Um gerador de arte ASCII criado por Érica Yabiku. Esta é uma versão para testar: crie à vontade, use sua câmera e brinque com as formas. O download fica só na versão de estúdio.</p>
      <a class="btn pri" href="./contato.html" data-pt="Gostou? Fale comigo" data-en="Like it? Get in touch">Gostou? Fale comigo</a>
      <div id="msg" role="status"></div>
    </div></details>
  </aside>
</div>
<script>
{
const FPS=30,TAU=Math.PI*2;
const DEF={size:'1080x1920',playing:true,rot:1,pulse:3,loop:true,loopF:450,sym:22,cx:3.8,sharp:100,dens:30,shape:'petals',look:'flat',scale:1.3,grid:70,cs:'binary',word:'',custom:'*+·',colorMode:'solid',c1:'#00ff40',c2:'#ff2e7e',bgMode:'solid',bg:'#000000',morph:false,mset:['petals','rings','spiral','star','lattice'],hold:60,trans:30,mstyle:'melt',mvary:false,src:'shapes',vFit:'fill',vPan:0,vZoom:1,vCrop:true,vAuto:true,vInv:false,vMix:0,vIn:0,vOut:0,tPal:'iron',tSmooth:4,tBg:true,tMotion:60,vMirror:true,camId:''};

const MANDALAS=new Set(['petals','rings','spiral','star','lattice']),RADIAL=new Set([...MANDALAS,'sunflower']),SYMS=new Set([...MANDALAS,'tunnel','sphere']);

 ['Fonte',[
  {k:'src',t:'seg',l:'Fonte',o:[['shapes','Formas'],['camera','Câmera']]},

  {k:'cx',t:'range',l:'Complexidade',min:1,max:10,step:.1},

  {k:'shape',t:'select',l:'Forma',o:[['__g','Mandalas'],['petals','Pétalas'],['rings','Anéis'],['spiral','Espiral'],['star','Estrela'],['lattice','Treliça'],['__g','Outras formas'],['waves','Ondas'],['tunnel','Túnel'],['sphere','Esfera 3D'],['heart','Coração'],['sunflower','Girassol'],['ripples','Ondulação na água'],['plasma','Plasma'],['contours','Curvas de nível'],['rain','Chuva Matrix'],['bigword','Palavra gigante']],show:()=>!P.morph},
  {k:'look',t:'seg',l:'Look',o:[['flat','Flat'],['glow','Glow']]}]],
 ['ASCII',[
  {k:'scale',t:'range',l:'Escala',min:.3,max:3,step:.05},
  {k:'grid',t:'range',l:'Resolução da grade',min:20,max:160,step:1},
  {k:'cs',t:'select',l:'Caracteres',o:[['wordfull','Palavra inteira'],['word','Palavra em sequência'],['binary','Binário (0 1)'],['numbers','Números'],['blocks','Blocos ░▒▓█'],['classic','Clássico .:-=+*#'],['dots','Pontos ·•●'],['letters','Letras'],['custom','Personalizado']]},
  {k:'word',t:'text',l:'Palavra',ph:'Digite sua palavra…',show:()=>P.cs==='word'||P.cs==='wordfull'},
  {k:'custom',t:'text',l:'Seus caracteres',show:()=>P.cs==='custom'}]],
 ['Cor',[
  {k:'colorMode',t:'seg',l:'Modo',o:[['solid','Sólida'],['gradient','Gradiente'],['rainbow','Arco-íris'],['video','Da câmera'],['thermal','Térmica']]},
  {k:'tPal',t:'seg',l:'Paleta térmica',o:[['iron','Ferro'],['rainbow','Arco-íris'],['white','Branco quente']],show:()=>P.colorMode==='thermal'},
  {k:'tBg',t:'seg',l:'Imagem térmica de fundo',o:[[false,'Off'],[true,'On']],show:()=>P.colorMode==='thermal'},
  {k:'tSmooth',t:'range',l:'Suavizar',min:0,max:12,step:1,show:()=>P.colorMode==='thermal'&&isV()},
  {k:'tMotion',t:'range',l:'Calor de movimento',min:0,max:100,step:1,show:()=>P.colorMode==='thermal'&&isV()},
  {k:'c1',t:'color',l:'Cor (centro)',show:()=>P.colorMode==='solid'||P.colorMode==='gradient'},

 ['Fundo e formato',[

  {k:'size',t:'select',l:'Tamanho',o:[['1080x1920','Reels 1080×1920'],['1080x1350','Feed 1080×1350'],['1080x1080','Quadrado 1080×1080'],['1920x1080','Horizontal 1920×1080']]}]]
];
const EN={"Fonte": "Source", "Formas": "Shapes", "Câmera": "Camera", "Câmera padrão": "Default camera", "Espelhar": "Mirror", "Enquadrar": "Framing", "Preencher": "Fill", "Encaixar": "Fit", "Posição horizontal": "Horizontal position", "Contraste automático": "Auto contrast", "Inverter claro/escuro": "Invert light/dark", "Mistura com a forma": "Blend with shape", "Animação": "Animation", "Pausar": "Pause", "Rotação": "Rotation", "Velocidade": "Speed", "Pulso": "Pulse", "Loop perfeito": "Perfect loop", "Duração (frames)": "Duration (frames)", "Grava (frames)": "Length (frames)", "Transformar mandalas": "Morph mandalas", "Transformar": "Morph", "Formas na sequência": "Shapes in sequence", "Pausa em cada forma": "Hold on each shape", "Transição": "Transition", "Estilo": "Style", "Derreter": "Melt", "Onda": "Wave", "Variar simetria": "Vary symmetry", "Geometria e estilo": "Geometry & style", "Simetria": "Symmetry", "Complexidade": "Complexity", "Nitidez": "Sharpness", "Densidade": "Density", "Forma": "Shape", "Mandalas": "Mandalas", "Outras formas": "Other shapes", "Pétalas": "Petals", "Anéis": "Rings", "Espiral": "Spiral", "Estrela": "Star", "Treliça": "Lattice", "Ondas": "Waves", "Túnel": "Tunnel", "Esfera 3D": "3D sphere", "Coração": "Heart", "Girassol": "Sunflower", "Ondulação na água": "Water ripples", "Plasma": "Plasma", "Curvas de nível": "Contour lines", "Chuva Matrix": "Matrix rain", "Palavra gigante": "Giant word", "Escala": "Scale", "Resolução da grade": "Grid resolution", "Caracteres": "Characters", "Palavra inteira": "Whole word", "Palavra em sequência": "Word in sequence", "Binário (0 1)": "Binary (0 1)", "Números": "Numbers", "Blocos ░▒▓█": "Blocks ░▒▓█", "Clássico .:-=+*#": "Classic .:-=+*#", "Pontos ·•●": "Dots ·•●", "Letras": "Letters", "Personalizado": "Custom", "Palavra": "Word", "Digite sua palavra…": "Type your word…", "Seus caracteres": "Your characters", "Cor": "Color", "Modo": "Mode", "Sólida": "Solid", "Gradiente": "Gradient", "Arco-íris": "Rainbow", "Da câmera": "From camera", "Térmica": "Thermal", "Paleta térmica": "Thermal palette", "Ferro": "Iron", "Branco quente": "White hot", "Imagem térmica de fundo": "Thermal background", "Suavizar": "Smooth", "Calor de movimento": "Motion heat", "Cor (centro)": "Color (center)", "Cor (borda)": "Color (edge)", "Fundo e formato": "Background & format", "Fundo": "Background", "Nenhum": "None", "Sólido": "Solid", "Cor do fundo": "Background color", "Tamanho": "Size", "Reels 1080×1920": "Reels 1080×1920", "Feed 1080×1350": "Feed 1080×1350", "Quadrado 1080×1080": "Square 1080×1080", "Horizontal 1920×1080": "Landscape 1920×1080", "câmera ao vivo": "live camera", "Meu preset": "My preset", "— escolher —": "— choose —", "Preset salvo: ": "Preset saved: ", "Preset apagado.": "Preset deleted.", "Este navegador não deixa guardar presets aqui.": "This browser can't store presets here.", "Câmera ao vivo. Use “Tela cheia” (tecla F) para projetar.": "Live camera. Use “Fullscreen” (F key) to project.", "cam_err": "Couldn't open the camera. Check the browser permission and try again."};
let LANG=(()=>{try{return localStorage.getItem("preferredLanguage")==="en"?"en":"pt"}catch(e){return"pt"}})();
const tr=t=>LANG==="en"?(EN[t]??t):t;

const cv=$('cv'),ctx=cv.getContext('2d'),tx=document.createElement('canvas'),tc=tx.getContext('2d');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- UI ---------- */
function ctrl(c){
  const id='c_'+c.k;let inp;
  if(c.t==='range')inp=`<input type="range" id="${id}" min="${c.min}" max="${c.max}" step="${c.step}"><output id="o_${c.k}"></output>`;

}
const ALL=SPEC.flatMap(s=>s[1]);
let camOpts='';
function fmt(c,v){return['loopF','hold','trans','vIn','vOut'].includes(c.k)?v+' f':(c.step<1?(+v).toFixed(c.step<.1?2:1):v)}
function sync(){
  for(const c of ALL){
    const el=$('c_'+c.k),v=P[c.k];
    if(c.t==='range'){el.value=v;$('o_'+c.k).textContent=fmt(c,v)}
    else if(c.t==='multi')el.querySelectorAll('button').forEach(b=>{const on=v.includes(JSON.parse(b.dataset.v));b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
    else if(c.t==='seg')el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',JSON.parse(b.dataset.v)===v));
    else if(document.activeElement!==el)el.value=v;
    if(c.show)$('r_'+c.k).style.display=c.show()?'':'none';
  }
  $('r_rot').querySelector('label').textContent=tr(P.shape==='rain'?'Velocidade':'Rotação');
  $('r_loopF').querySelector('label').textContent=tr(P.loop?'Duração (frames)':'Grava (frames)');
  $('playBtn').textContent=P.playing?tr('Pausar'):'Play';
  cv.classList.toggle('tr',P.bgMode==='none');
}
function buildUI(){
$('ctl').innerHTML=SPEC.map(([t,cs])=>`<details open><summary>${esc(tr(t))}</summary><div class="rows">${cs.map(ctrl).join('')}</div></details>`).join('');
if(camOpts){$('c_camId').innerHTML=camOpts}
for(const c of ALL){

let frame=0,last=performance.now(),busy=false,rec=null;
function curF(){if(CAM()&&camReady)return Math.round(vid.currentTime*FPS);if(VON())return Math.min(vFrames-1,Math.round(vid.currentTime*FPS));return P.loop?Math.floor(frame)%LL():Math.floor(frame)}
function draw(){render(curF());$('fr').textContent=CAM()&&camReady?tr('câmera ao vivo'):P.loop||VON()?`frame ${curF()} / ${LL()}`:`frame ${curF()}`}
function tick(now){
  const dt=(now-last)/1000;last=now;
  if(rec){
    if(rec.cam){render(curF(),true);$('fr').textContent=`gravando ao vivo ${Math.round((now-rec.t0)/1000*FPS)} f`}
    else if(rec.video){const f=Math.round(vid.currentTime*FPS);
      if(vid.ended||f>=P.vOut)rec.done();else{render(f,true);$('fr').textContent=`gravando ${f} / ${P.vOut}`;$('pbar').style.width=(f-P.vIn)/Math.max(1,P.vOut-P.vIn)*100+'%'}}
    else{const f=Math.floor((now-rec.t0)/1000*FPS);
      if(f>=LL()){rec.done()}else{render(f,true);$('fr').textContent=`gravando ${f} / ${LL()}`;$('pbar').style.width=f/LL()*100+'%'}}}
  else if(!busy&&VON()){
    if(P.playing&&vid.paused)vid.play().catch(()=>{});
    if(!P.playing&&!vid.paused&&!CAM())vid.pause();
    if(P.playing)draw();
  }
  else if(!busy&&P.playing){if(!vid.paused&&!CAM())vid.pause();frame+=dt*FPS;draw()}
  requestAnimationFrame(tick);
}

/* ---------- status ---------- */
const msg=t=>{$('msg').textContent=t};

/* ---------- presets ---------- */
const KEY='mandalaAsciiPresets';
function loadP(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
function storeP(o){try{localStorage.setItem(KEY,JSON.stringify(o));return true}catch(e){return false}}
function listP(sel){const o=loadP(),n=Object.keys(o);$('plist').innerHTML=`<option value="">${tr('— escolher —')}</option>`+n.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('');if(sel)$('plist').value=sel}
$('psave').onclick=()=>{const o=loadP(),name=$('pname').value.trim()||'Preset '+(Object.keys(o).length+1);o[name]={...P,playing:true};msg(storeP(o)?tr('Preset salvo: ')+name:tr('Este navegador não deixa guardar presets aqui.'));listP(name)};
$('plist').onchange=()=>{const o=loadP()[$('plist').value];if(!o)return;P={...DEF,mset:[...DEF.mset],...o};$('pname').value=$('plist').value;resize();sync();draw()};
$('pdel').onclick=()=>{const k=$('plist').value;if(!k)return;const o=loadP();delete o[k];storeP(o);listP();msg(tr('Preset apagado.'))};

/* ---------- buttons ---------- */
const rnd=(a,b,s)=>Math.round((a+Math.random()*(b-a))/s)*s;
const hsl2hex=(h,s,l)=>{s/=100;l/=100;const f=n=>{const k=(n+h/30)%12,c=l-s*Math.min(l,1-l)*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(c*255).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)};
$('randBtn').onclick=()=>{
  const pick=a=>a[Math.random()*a.length|0];
  Object.assign(P,{sym:rnd(4,28,1),cx:+rnd(1.5,7,.1).toFixed(1),sharp:rnd(40,100,1),dens:rnd(30,70,1),shape:pick(['petals','rings','spiral','star','lattice','waves','tunnel','sphere','heart','sunflower','ripples','plasma','contours','rain','bigword']),scale:+rnd(.9,1.8,.05).toFixed(2),grid:rnd(45,110,1),cs:pick(['binary','numbers','blocks','classic','dots','letters']),colorMode:pick(['solid','gradient','rainbow']),c1:hsl2hex(rnd(0,359,1),95,60),c2:hsl2hex(rnd(0,359,1),95,60),rot:rnd(-3,3,1),pulse:rnd(1,6,1)});
  sync();draw();
};
$('resetBtn').onclick=()=>{P={...DEF,mset:[...DEF.mset]};resize();sync();frame=0;draw()};
$('playBtn').onclick=()=>{P.playing=!P.playing;sync();if(!P.playing)draw()};
function toggleFS(){const on=!document.body.classList.contains('fs');document.body.classList.toggle('fs',on);
  try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}setTimeout(fit,60)}
$('fsBtn').onclick=toggleFS;
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.body.classList.remove('fs');setTimeout(fit,60)}});
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='f'||e.key==='F'){toggleFS()}else if(e.key==='Escape'&&document.body.classList.contains('fs')){toggleFS()}else if(e.key==='r'||e.key==='R'){$('randBtn').click()}});
addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();P.playing=!P.playing;sync()}});

cv.addEventListener('contextmenu',e=>e.preventDefault());cv.setAttribute('draggable','false');
function applyStatic(){document.documentElement.lang=LANG==='en'?'en':'pt-br';document.querySelectorAll('[data-pt][data-en]').forEach(el=>{el.textContent=el.getAttribute('data-'+LANG)});$('pname').placeholder=tr('Meu preset');$('langBtn').textContent=LANG==='en'?'PT':'EN'}
$('langBtn').onclick=()=>{LANG=LANG==='en'?'pt':'en';try{localStorage.setItem('preferredLanguage',LANG)}catch(e){}buildUI();applyStatic();listP($('plist').value);sync();draw()};
function applyTheme(t){document.documentElement.dataset.theme=t;$('themeBtn').textContent=t==='dark'?'☀':'☾';try{localStorage.setItem('theme',t)}catch(e){}}
let th0;try{th0=localStorage.getItem('theme')||'light'}catch(e){th0='light'}applyTheme(th0);
$('themeBtn').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
applyStatic();resize();sync();listP();draw();requestAnimationFrame(tick);
document.fonts&&document.fonts.ready.then(()=>{maskKey='';draw()});
}
</script>
</body>
